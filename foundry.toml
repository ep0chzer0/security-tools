[profile.default]
src = "foundry-templates"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.19"
optimizer = true
optimizer_runs = 200

[profile.default.fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "params_first"
quote_style = "double"
number_underscore = "preserve"

[profile.ci]
fuzz = { runs = 1000 }
verbosity = 3
